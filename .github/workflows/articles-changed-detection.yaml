# articles-changed-detection.yaml - 変更を自動検知しプロジェクトごとに並列実行するテスト
---
name: Articles - Changed detection sample

on:
  pull_request:
    paths:
      # Since variables cannot be used in `on.paths`, this part must be hardcoded.
      - 'articles/changed-detections/**'
      - '.github/workflows/articles-changed-detection.yaml'
  workflow_dispatch:

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BASE_DIR: 'articles/changed-detections'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.set-matrix.outputs.projects }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Get the entire history for difference detection
          fetch-depth: 0

      # Automatically obtain changed folders as a JSON array using the plugin!
      - name: Get changed directories
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          json: true
          matrix: true
          dir_names: true
          dir_names_max_depth: 3 # path/to/xxx
          files: ${{ env.TARGET_BASE_DIR }}/**

      # Finalize the array and pass it to the output
      - name: Set matrix output
        id: set-matrix
        run: |
          # For manual execution (workflow_dispatch), target all projects under path/to/
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PROJECTS=$(ls -d $TARGET_BASE_DIR/*/ | cut -d'/' -f3 | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "projects=$PROJECTS" >> $GITHUB_OUTPUT
          else
            # json array returned from the plugin (e.g. ["path/to/AAA", "path/to/BBB"])
            CHANGED_DIRS='${{ steps.changed-files.outputs.all_changed_files }}'

            if [ "$CHANGED_DIRS" = "[]" ] || [ -z "$CHANGED_DIRS" ]; then
              echo "projects=[]" >> $GITHUB_OUTPUT
            else
              # Trim to "path/to/web" -> "web" instantly with jq
              PROJECTS=$(echo "$CHANGED_DIRS" | jq -c 'map(split("/") | .[2])')
              echo "projects=$PROJECTS" >> $GITHUB_OUTPUT
            fi
          fi

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    name: build-and-test (${{ matrix.project }})

    permissions:
      contents: read
    strategy:
      fail-fast: false # Continue other parallel builds even if one project fails
      max-parallel: 4
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.projects) }}

    steps:
      - uses: actions/checkout@v7
      - name: Log Target Project Info
        run: |
          echo "=========================================================="
          echo "🚀 Processing Project: ${{ matrix.project }}"
          echo "=========================================================="

      - name: Find Target and Define Assets Path
        run: |
          # 1. First, search for the target
          FIND_PATH="$TARGET_BASE_DIR/${{ matrix.project }}"
          TARGET=$(find "$FIND_PATH" -maxdepth 2 \( -name "*.slnx" -o -name "*.sln" -o -name "*.md" \) | head -n 1)

          if [ -z "$TARGET" ]; then
            echo "::error::No .slnx, or .sln found in $FIND_PATH"
            exit 1
          fi

          # 2. Get the target's parent directory (e.g., src/web/Web.slnx -> src/web)
          TARGET_DIR=$(dirname "$TARGET")

          # 3. Set the absolute path for the assets folder within that parent directory
          # (e.g., /github/workspace/src/web/assets)
          PROJECT_ASSETS_PATH="${{ github.workspace }}/$TARGET_DIR/assets"

          # Save each to environment variables
          echo "TARGET_PATH=$TARGET" >> $GITHUB_ENV
          echo "TEST_ASSETS_PATH=$PROJECT_ASSETS_PATH" >> $GITHUB_ENV

          echo "🎯 Target detected: $TARGET"
          echo "📂 Test assets will be generated at: $PROJECT_ASSETS_PATH"

      - name: Build for ${{ matrix.project }}
        run: |
          echo ${{ env.TARGET_PATH }}

      - name: Run Test Assets Scripts (If exists)
        run: |
          SCRIPT_PATH="$TARGET_BASE_DIR/${{ matrix.project }}/scripts/generate-test-assets.sh"
          if [ -f "$SCRIPT_PATH" ]; then
            echo "Found asset generation script. Running..."
            chmod +x "$SCRIPT_PATH"
            "$SCRIPT_PATH" ${{ env.TEST_ASSETS_PATH }}
          else
            echo "No asset generation script found. Skipping this step."
          fi
        timeout-minutes: 1
