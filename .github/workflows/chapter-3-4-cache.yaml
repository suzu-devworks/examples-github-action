# Chapter 3 キャッシュ活用によるCIの高速化.
---
name: Chapter 3 (4) - Cache

on:
  pull_request:
    paths:
      - '.github/workflows/cache.yaml'
  workflow_dispatch:

permissions: {}
defaults:
  run:
    shell: bash
    
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-start:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo 'start!'

  build-go:
    runs-on: ubuntu-latest
    needs: build-start
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: './chapters/go/'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          # cache: true (default)
          cache-dependency-path: '**/go.sum'
      - run: go mod download

  build-go-cache:
    runs-on: ubuntu-latest
    needs: build-go
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: './chapters/go/'
    steps:
      - uses: actions/checkout@v7
      - name: build-start のキャッシュを再現
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - run: go mod download

  build-node:
    runs-on: ubuntu-latest
    needs: build-start
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: './chapters/node/'
    steps:
      - uses: actions/checkout@v7
      # https://github.com/actions/setup-node/blob/v4/docs/advanced-usage.md#caching-packages-data
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'
      - run: yarn install --frozen-lockfile

  build-node-pnpm:
    runs-on: ubuntu-latest
    needs: build-node
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: './chapters/node/'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      - run: pnpm install

  build-dotnet:
    runs-on: ubuntu-latest
    needs: build-start
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./chapters/dotnet
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore --locked-mode

  build-join:
    runs-on: ubuntu-latest
    needs: [build-go-cache, build-node-pnpm, build-dotnet]
    permissions:
      contents: read
    steps:
      - run: echo 'end'
