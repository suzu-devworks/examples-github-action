# Chapter 2 プルリクエスト駆動でCIを実現する.
---
name: Chapter 2 (1) - CI

on:
  # main ブランチへのプルリクエストが作成されたときに実行する
  pull_request:
    branches:
      - main
    paths:
      - './chapters/go/hello-api/**'
      - '.github/workflows/chapter-2-1-ci.yaml'
  workflow_dispatch:

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: 'chapters/go/hello-api/'

    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7.0.1

      - name: Go の環境をセットアップする
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: フォーマットを実行する
        # gofmt はフォーマット違反の検出にかかわらず正常終了する。
        # そのため test -z で違反がある場合に失敗させる。
        run: test -z "$(gofmt -l .)"

      - name: 静的解析を実行する
        run: go vet ./...

      - name: テストを実行する
        run: go test

      - name: ビルドを実行する
        run: go build .
