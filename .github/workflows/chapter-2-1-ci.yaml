# Chapter 2 プルリクエスト駆動でCIを実現する.
---
name: Chapter 2 (1) - CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "./chapters/go/go.mod"
      - "./chapters/go/go.sum"
      - "./chapters/go/*.go"
      - ".github/workflows/chapter-2-1-ci.yaml"
  workflow_dispatch:

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./chapters/go/

    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7
      - name: Go の環境をセットアップする
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          
      - name: フォーマットを実行する
        # フォーマット違反時にステップを失敗させる
        run: test -z "$(gofmt -l .)"
      - name: 静的解析を実行する
        run: go vet ./...
      - name: テストを実行する
        run: go test
      - name: ビルドを実行する
        run: go build .
