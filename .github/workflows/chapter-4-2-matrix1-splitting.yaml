# Chapter 4 ユースケース 1. テストの分割.
---
name: Chapter 4 (2) - Use Case 1. Test Splitting

on:
  pull_request:
    paths:
      - '.github/workflows/chapter-4-2-matrix1-splitting.yaml'
  workflow_dispatch:

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# テストフレームワークによっては、テストを複数のジョブに分割して並行に実行することで、テストの実行時間を短縮することができます。

jobs:
  test:
    name: Example of splitting tests and running them in parallel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        shared: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v7
      # jest では、--shard オプションを利用することで、テストを分割して実行することができます。
      - name: Run test
        run: echo "npx jest --shred ${{ matrix.shared }}"
