# Chapter 2 マージ駆動でCDを実現する.
---
name: Chapter 2 (3) - CD with Docker action

on:
  push:
    branches:
      - main
    paths:
      - "./chapters/go/go.mod"
      - "./chapters/go/go.sum"
      - "./chapters/go/*.go"
      - "./chapters/go/Dockerfile"
      - "./.github/workflows/chapter-2-3-cd-action.yaml"
  workflow_dispatch:

permissions: {}
defaults:
  run:
    shell: bash
    
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cd:
    name: cd
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./chapters/go/
        
    steps:
      - uses: actions/checkout@v7

      - name: Container registry に認証する
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker をビルドおよびプッシュする
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
