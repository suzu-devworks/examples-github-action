# Chapter 2 マージ駆動でCDを実現する.
---
name: Chapter 2 (2) - CD

on:
  # main への push つまりマージが行われたときに実行する
  push:
    branches:
      - main
    paths:
      - 'chapters/go/hello-api/**'
      - '.github/workflows/chapter-2-2-cd.yaml'
  workflow_dispatch:

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cd:
    name: cd
    runs-on: ubuntu-latest
    # GitHub Container Registry にイメージを push するための権限を付与する
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: './chapters/go/hello-api/'

    steps:
      - uses: actions/checkout@v7

      - name: Container registry に認証する
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Docker ビルドする
        run: docker build -t ghcr.io/${{ github.repository }}:latest .

      - name: Docker イメージをプッシュする
        run: docker push ghcr.io/${{ github.repository }}:latest
