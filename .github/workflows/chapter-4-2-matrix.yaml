# Chapter 4 matrix strategy によるジョブ実行の応用.
---
name: Chapter 4 (2) - Matrix strategy

on:
  pull_request:
    paths:
      - '.github/workflows/matrix.yaml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Example of a job running in parallel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 5
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: './chapters/go/hello-api/'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Ser up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run go build
        run: go build .
